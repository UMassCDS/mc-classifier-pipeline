[pytest]
# Suppress deprecation warnings from label_studio_sdk and pydantic
# These are due to label_studio_sdk using Pydantic v1-style validators, which are deprecated in Pydantic v2.
# They do not affect the correctness of your code or tests and can be ignored until the SDK is updated.
filterwarnings =
    ignore::DeprecationWarning:label_studio_sdk.*
    ignore::DeprecationWarning:pydantic.*
